[AUTHOR]
NAME=Rico Tengler
EMAIL=rico@cod-lan.de

[PLUGIN]
VERSION=0.8.0
NAME=nut2lox
FOLDER=nut2lox
TITLE=Nut2Lox
WEBSITE=https://github.com/ricten/Nut2Lox

[AUTOUPDATE]
# true: neue Installationen bekommen automatische Release-Updates (der Benutzer kann das in der Plugin-Verwaltung aendern).
# LoxBerry liest RELEASECFG regelmaessig; Format der release.cfg wie im LoxBerry SamplePlugin (VERSION, ARCHIVEURL, INFOURL).
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/ricten/Nut2Lox/main/release.cfg
PRERELEASECFG=

[SYSTEM]
REBOOT=false
LB_MINIMUM=4.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
# true: LoxBerry zeigt die Loglevel-Auswahl in der Plugin-Verwaltung (Installer: SYSTEM.CUSTOM_LOGLEVELS)
CUSTOM_LOGLEVELS=true
INTERFACE=2.0
